# Kalıcı iOS dağıtım sertifikası (yılda bir kez). Adımlar: apple/TESTFLIGHT.md → "Kalıcı imza sertifikası".
# Önce SIGN_P12_PASSWORD gizli değişkenini ekle; çıktı (dist-cert) şifreli p12'nin base64 hâli,
# içeriğini SIGN_P12_BASE64 gizli değişkenine yapıştır ve artifact'i sil.
name: iOS imza sertifikası

on:
  workflow_dispatch:

jobs:
  cert:
    name: Dağıtım sertifikası oluştur
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Sertifika
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$SIGN_P12_PASSWORD" || { echo "::error::Önce SIGN_P12_PASSWORD gizli değişkenini ekle"; exit 1; }
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" apple/ci/asc_signing.py create-cert
          rm -f "$ASC_KEY_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cert
          path: dist-cert.txt
          retention-days: 1
