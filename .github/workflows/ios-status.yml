# App Store Connect'te derlemelerin işlenme durumu ve TestFlight grupları (yalnızca okur).
name: iOS TestFlight durumu

on:
  workflow_dispatch:

jobs:
  status:
    name: Durum
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: com.othinks.cornershopempire
    steps:
      - uses: actions/checkout@v4
      - name: Durum
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" apple/ci/asc_status.py
          rm -f "$ASC_KEY_PATH"
