# iOS: her push'ta simülatör için imzasız derleme (Swift + oyun derleniyor mu?).
# TestFlight: Actions → iOS → "Run workflow" → testflight: true (ya da `ios-v*` etiketi).
# Gerekli gizli değişkenler (Settings → Secrets → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (.p8 içeriği), APPLE_TEAM_ID
name: iOS

on:
  push:
    branches: [main, master]
    tags: ['ios-v*']
    paths: ['src/**', 'apple/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.js', '.github/workflows/ios.yml']
  pull_request:
    paths: ['src/**', 'apple/**']
  workflow_dispatch:
    inputs:
      testflight:
        description: "TestFlight'a yükle"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Simülatör derlemesi
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıklar
        run: |
          npm ci
          cd apple && npm ci
      - name: Oyunu derle ve iOS projesine kopyala
        run: cd apple && npm run sync
      - name: Xcode seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Derle (iPhone simülatörü, imzasız)
        run: |
          set -o pipefail
          xcodebuild -project apple/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Hataları göster
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          tail -60 build.log

  testflight:
    name: TestFlight'a yükle
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      BUNDLE_ID: com.othinks.cornershopempire
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıklar ve oyun
        run: |
          npm ci
          cd apple && npm ci && npm run sync
      - name: Xcode seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: App Store Connect anahtarı
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$APPLE_TEAM_ID" -a -n "$ASC_PRIVATE_KEY" || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY / APPLE_TEAM_ID gizli değişkenleri eksik"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_PRIVATE_KEY" > $KEY
          chmod 600 $KEY
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      # Otomatik imza arşivde geliştirme profili ister (kayıtlı cihaz gerekir). Bunun yerine geçici
      # dağıtım sertifikası + App Store profili (cihaz gerekmez); iş sonunda silinir. Bkz. apple/ci/asc_signing.py
      - name: Geçici imza (sertifika + profil)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" apple/ci/asc_signing.py setup
      - name: Anahtarlık
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$SIGN_P12" -k "$KC" -P "$SIGN_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -f "$SIGN_P12"
      - name: Arşivle
        run: |
          set -o pipefail
          xcodebuild -project apple/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: TestFlight'a yükle
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$ASC_KEY_PATH" 2>&1 | tee export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
      - name: Hataları göster
        if: failure()
        run: |
          cat archive.log export.log 2>/dev/null | grep -E "error:|Error" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Geçici sertifika ve profili sil
        if: always()
        run: |
          test -x "$RUNNER_TEMP/venv/bin/python" && "$RUNNER_TEMP/venv/bin/python" apple/ci/asc_signing.py cleanup || true
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
